name: Build Android APK

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean workspace and create clean flutter project
        run: |
          # Remove arquivos conflitantes da raiz mantendo a pasta lib e pubspec se existirem
          mkdir -p backup_lib
          cp -r lib/* backup_lib/ 2>/dev/null || true
          
          # Cria um projeto limpo do flutter em uma pasta temporária
          flutter create temp_project --org com.velos.app --platforms android
          
          # Copia os códigos criados por você para dentro do projeto limpo
          rm -rf temp_project/lib/*
          cp -r backup_lib/* temp_project/lib/ 2>/dev/null || true
          
          # Move para dentro do projeto limpo para compilar
          cd temp_project
          flutter pub get
          flutter build apk --release
          
          # Move o APK gerado para a raiz para o upload pegar
          mkdir -p ../build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk ../build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
